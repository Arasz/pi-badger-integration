name: release

# Tags `main` and cuts a GitHub release the moment VERSION changes. Same
# mechanism as ai-raccoon's release.yml: the version is a file, the tag and
# the release derive from it, and the workflow never decides a version itself.
# Releases matter beyond ceremony here — the update-check extension reads
# `releases/latest`, so cutting a release is what makes other checkouts
# notice there is something newer to pull.
#
# Trigger is `push` to `main` filtered to VERSION only. That filter must stay
# on `push`, never move to `pull_request`: a filtered pull_request trigger
# starves required status checks on PRs that do not touch VERSION. This
# workflow's job name must likewise never be added to any required-checks
# list — it gates nothing a PR needs to merge.

on:
  push:
    branches: [main]
    paths: ["VERSION"]

permissions:
  contents: read

# Two VERSION pushes landing close together must not race to tag/release twice;
# never cancel a run that may already have pushed a tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only job in this workflow, and the only one that writes: tagging and
      # releasing both need `contents: write`. Scoped here, not at workflow
      # level, matching ci.yml/auto-bump.yml's pattern of workflow-level
      # `contents: read` with jobs escalating individually.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate VERSION format
        # A re-check here is what fails loudly (not with an empty/garbage tag)
        # if VERSION is ever malformed on main.
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must be a bare semver (e.g. 1.2.3); found '$VERSION'." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag already exists
        # Idempotence: a re-run of this workflow (retry, or any other push that
        # doesn't change VERSION further) must be a no-op, never a move. Queried
        # against the remote rather than the local checkout, so this doesn't
        # depend on actions/checkout's tag-fetching behaviour.
        id: check
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.tag }} already exists; skipping (idempotent no-op)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the tag
        # Lightweight tag pointing straight at the commit, matching all existing
        # vX.Y.Z tags. Never `-f`: when the tag already exists the previous step
        # skips this one, so this line never moves an existing tag.
        if: steps.check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create the GitHub release
        # --generate-notes builds the changelog from merged PRs since the
        # previous tag (GitHub's own compare view, not a hand-maintained notes
        # file) — small scoped commits keep those notes readable.
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --title "${{ steps.version.outputs.tag }}" --generate-notes
