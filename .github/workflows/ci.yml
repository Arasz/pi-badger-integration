name: ci

# Local gates, mirrored: `bun test` plus the typecheck on every push to main
# and every pull request. `bun run check` stays local-only — it compares the
# canonical tree against the runner's installed user scope, which is empty on
# a fresh CI machine by definition, so it would fail there unconditionally.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install extension dependencies
        # Each extension is a directory-package with its own manifest + lockfile;
        # nested node_modules is gitignored derived state, absent in fresh clones
        # (and fresh worktrees). Suites import extension sources directly, so
        # without this, an extension fails resolving its own deps.
        run: |
          for dir in extensions/*/; do
            (cd "$dir" && bun install --frozen-lockfile)
          done

      - name: Install pi globally (test harness mirrors the global tree)
        # tests/setup.ts resolves pi + jiti from the bun-global install, and
        # lifecycle tests symlink that tree into a fake $HOME. Pinned to the
        # devDep so CI loads the same pi the repo develops against.
        run: |
          PI_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['devDependencies']['@earendil-works/pi-coding-agent'])")
          bun install -g "@earendil-works/pi-coding-agent@$PI_VERSION"

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun tsc --noEmit -p .
