name: ci

# Local gates, mirrored: `bun test` plus the typecheck on every push to main
# and every pull request. `bun run check` stays local-only — it compares the
# canonical tree against the runner's installed user scope, which is empty on
# a fresh CI machine by definition, so it would fail there unconditionally.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install extension dependencies
        # Each extension is a directory-package with its own manifest + lockfile;
        # nested node_modules is gitignored derived state, absent in fresh clones
        # (and fresh worktrees). Suites import extension sources directly, so
        # without this pi-mcp-tools et al. fail resolving their own deps.
        run: |
          for dir in extensions/*/; do
            (cd "$dir" && bun install --frozen-lockfile)
          done

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit -p .
