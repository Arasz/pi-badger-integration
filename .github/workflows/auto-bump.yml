name: auto-bump

# Test-gated patch releases: a push to main that does NOT touch VERSION gets
# its tests run, and on green a patch-bump commit is pushed, tagged and
# released right here. A push that already touched VERSION is left alone: a
# human-chosen version (minor/major, or a hand-picked patch) always wins over
# the automation, and the bump's own VERSION-only commit terminates the chain
# instead of looping it. Tag + release live in this job (not via release.yml)
# because a GITHUB_TOKEN push never triggers new workflow runs — delegating
# would silently release nothing. release.yml stays as the twin for manual
# VERSION pushes, which do trigger it.
#
# The bump lands as a PULL REQUEST, not as a push to main. main is protected by
# a ruleset that requires the `test` status check, and a GITHUB_TOKEN push
# triggers no workflow run — so a pushed bump commit can never carry that
# check, and the push is rejected (GH013: "Required status check \"test\" is
# expected"). A bump PR is the ordinary path: the required check runs on it,
# the merge is the gate, and nothing is weakened to let a bot skip it. The
# merge is performed by this job once the check passes; a GITHUB_TOKEN merge
# triggers no workflow run either, which is why the tag and the release stay
# in this job.
#
# net effect: merging without thinking about versions still cuts exactly one
# patch release per change; thinking about versions overrides cleanly.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialise with release.yml's group semantics: two pushes racing to bump must
# not fork VERSION. Never cancel a run that may already have pushed a bump.
concurrency:
  group: auto-bump
  cancel-in-progress: false

jobs:
  test-and-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Pushing the bump branch and opening/merging its PR need `contents:
      # write` and `pull-requests: write`. Scoped to this job.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the VERSION-touch check diffs against the pre-push
          # base, and the push retry rebases onto the latest main.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install extension dependencies
        # Same as ci.yml: directory-packages resolve their own deps from
        # nested (gitignored) node_modules, absent in fresh clones.
        run: |
          for dir in extensions/*/; do
            (cd "$dir" && bun install --frozen-lockfile)
          done

      - name: Install pi globally (test harness mirrors the global tree)
        # Same as ci.yml: tests/setup.ts + lifecycle fake-$HOME need the
        # bun-global pi install at the pinned devDep version.
        run: |
          PI_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['devDependencies']['@earendil-works/pi-coding-agent'])")
          bun install -g "@earendil-works/pi-coding-agent@$PI_VERSION"

      - name: Run tests
        # The gate: a red suite bumps nothing. Failure stops the job here.
        run: bun test

      - name: Typecheck
        run: bunx tsc --noEmit -p .

      - name: Bump patch and push
        # gh needs an explicit token: the runner exports neither GH_TOKEN nor
        # GITHUB_TOKEN into step env by default (and set -u turns the missing
        # name into a hard failure after the tag already pushed).
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BASE="$BASE_SHA"
          if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="HEAD~1"
          fi
          if git diff --name-only "$BASE" HEAD -- | grep -qx "VERSION"; then
            echo "VERSION was touched by this push (manual version or a prior bump) — standing down."
            exit 0
          fi

          CURRENT="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$CURRENT" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::VERSION must be a bare semver; found '$CURRENT'." >&2
            exit 1
          fi
          NEXT="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"

          # The bump travels as a branch and a pull request: main's ruleset
          # requires the `test` check, and only a PR can carry it.
          BRANCH="chore/bump-$NEXT"
          git checkout -b "$BRANCH"
          echo "$NEXT" > VERSION
          git add VERSION
          git commit -m "chore(release): bump to $NEXT"
          git push origin "$BRANCH"

          PR_URL="$(gh pr create --base main --head "$BRANCH" \
            --title "chore(release): bump to $NEXT" \
            --body "Automated patch bump $CURRENT -> $NEXT. The ruleset requires the \`test\` check on everything that lands on main, and a GITHUB_TOKEN push triggers no workflow run, so the bump goes through a pull request like any other change.")"
          PR="${PR_URL##*/}"
          echo "Bump pull request: $PR_URL"

          # Wait for the required check. `gh pr checks` exits 0 when every
          # check passed, 8 while one is still pending, and 1 on a failure —
          # a failure is terminal, so it stops the job instead of waiting out
          # the timeout.
          for _ in $(seq 1 60); do
            set +e
            CHECKS="$(gh pr checks "$PR" 2>&1)"
            STATUS=$?
            set -e
            if [[ "$STATUS" == "0" ]]; then
              break
            fi
            if [[ "$STATUS" == "8" ]] || grep -qi "no checks reported" <<<"$CHECKS"; then
              sleep 15
              continue
            fi
            echo "::error::the bump pull request's checks did not pass." >&2
            echo "$CHECKS" >&2
            exit 1
          done
          if [[ "${STATUS:-1}" != "0" ]]; then
            echo "::error::the bump pull request's checks did not pass in time." >&2
            exit 1
          fi

          # The merge is the gate: the ruleset has already seen the check pass.
          # A squash keeps the bump one commit, like every other PR here.
          gh pr merge "$PR" --squash --delete-branch

          # Wait for the merge to land on main before tagging it: the tag must
          # point at the commit that carries the new VERSION.
          for _ in $(seq 1 30); do
            git fetch -q origin main
            if git show origin/main:VERSION 2>/dev/null | tr -d '[:space:]' | grep -qx "$NEXT"; then
              break
            fi
            sleep 5
          done

          # Tag + release the bump commit directly (see header: delegating to
          # release.yml would silently do nothing on a token merge). Same
          # never-move semantics: an existing tag is a no-op, never `-f`. The
          # release is checked on its own, because a merge that does trigger
          # release.yml can cut the same release from the other side.
          TAG="v$NEXT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping (idempotent no-op)."
          else
            git fetch -q origin main
            git tag "$TAG" origin/main
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping (idempotent no-op)."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes \
              || gh release view "$TAG" >/dev/null 2>&1 \
              || { echo "::error::could not create the release for $TAG." >&2; exit 1; }
          fi
